<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Clickable concept prototype for WorkWell: a mobile app for working adults to book preventive-care screenings, and a web dashboard for the care team. All data is fictional demo data.">
<meta name="theme-color" content="#0C2C30">
<style>html{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>WorkWell</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<style>
/* Layout concept: one design system, two surfaces. A phone frame for the worker, a sidebar console for the care team.
   Teal means care. Amber means working time. */
:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --surface-2:#E9F1EF; --ink:#0C2C30; --muted:#4F6669; --line:#D3E1DE;
  --brand:#0B7A7D; --brand-ink:#075B5E; --brand-tint:#DAEEEB; --on-brand:#FFFFFF;
  --work:#F2A007; --work-tint:#FFF0CC; --work-ink:#7A4E00;
  --good:#1B8A5A; --good-tint:#D9F1E5; --bad:#B93A2B; --bad-tint:#FBE3DF;
  --side:#0C2C30; --side-ink:#D6E6E3; --side-line:#1F4A50; --bezel:#0B1F22;
  --shadow:0 1px 2px rgba(12,44,48,.06),0 10px 30px rgba(12,44,48,.10);
  --f-display:'Source Serif 4',Cambria,Georgia,serif;
  --f-body:'Source Sans 3',Calibri,'Segoe UI',system-ui,sans-serif;
  --r:14px; --r-lg:20px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1E21; --surface:#112A2E; --surface-2:#173338; --ink:#E5F0EE; --muted:#9AB3B5; --line:#26474C;
  --brand:#3DC1C3; --brand-ink:#7FDADB; --brand-tint:#143F43; --on-brand:#06282B;
  --work:#F6B83A; --work-tint:#3B2E10; --work-ink:#F7C766;
  --good:#4FC48C; --good-tint:#123B2B; --bad:#F0796B; --bad-tint:#402019;
  --side:#07171A; --side-ink:#C9DEDB; --side-line:#173A3F; --bezel:#2B4C51;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1E21; --surface:#112A2E; --surface-2:#173338; --ink:#E5F0EE; --muted:#9AB3B5; --line:#26474C;
  --brand:#3DC1C3; --brand-ink:#7FDADB; --brand-tint:#143F43; --on-brand:#06282B;
  --work:#F6B83A; --work-tint:#3B2E10; --work-ink:#F7C766;
  --good:#4FC48C; --good-tint:#123B2B; --bad:#F0796B; --bad-tint:#402019;
  --side:#07171A; --side-ink:#C9DEDB; --side-line:#173A3F; --bezel:#2B4C51;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.ic{flex:none;display:block}
.num{font-variant-numeric:tabular-nums}
#root{height:100%;display:flex;flex-direction:column;padding-inline:16px}

/* top bar */
.top{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap;flex:none}
.brand{display:flex;align-items:center;gap:10px;font:700 19px var(--f-display)}
.mark{width:34px;height:34px;border-radius:10px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;flex:none}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:2px;margin-inline:auto}
.seg button{min-height:40px;padding:0 16px;border-radius:999px;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(12,44,48,.15)}
.tag{font-size:12px;font-weight:600;background:var(--work-tint);color:var(--work-ink);padding:5px 10px;border-radius:999px;white-space:nowrap}
.stage{flex:1;min-height:0;display:flex;padding-bottom:16px}

/* worker layout */
.worker{display:grid;grid-template-columns:minmax(0,330px) auto;gap:56px;justify-content:center;align-items:center;width:100%;min-height:0;height:100%}
.guide{display:grid;gap:16px;align-content:center}
.guide h2{font-size:26px;line-height:1.15}
.guide ol{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.guide li{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:600}
.guide li .dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:var(--on-brand)}
.guide li.done .dot{background:var(--brand);border-color:var(--brand)}
.guide li.done{color:var(--muted)}
.wrap{height:100%;display:flex;align-items:center;min-height:0}
.phone{position:relative;width:390px;height:min(100%,800px);background:var(--surface);border:9px solid var(--bezel);border-radius:46px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.statusbar{height:34px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-weight:700;font-size:13px}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:8px 20px 24px;display:flex;flex-direction:column;gap:16px}
.foot{flex:none;padding:12px 20px 14px;border-top:1px solid var(--line);background:var(--surface);display:grid;gap:8px}
.tabbar{flex:none;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface)}
.tabbar button{min-height:62px;background:none;border:0;display:grid;justify-items:center;align-content:center;gap:3px;color:var(--muted);font-weight:600;font-size:11.5px;cursor:pointer}
.tabbar button[aria-current=page]{color:var(--brand)}

/* type + primitives */
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.h1{font-size:30px;line-height:1.12}
.h2{font-size:21px;line-height:1.2}
.lead{font-size:16px;color:var(--muted)}
.fine{font-size:12.5px;color:var(--muted)}
.row{display:flex;gap:12px;align-items:center}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.gap8{display:grid;gap:8px}.gap12{display:grid;gap:12px}
.btn{min-height:52px;border-radius:14px;border:2px solid var(--brand);background:var(--brand);color:var(--on-brand);font-weight:700;font-size:16px;display:flex;gap:10px;align-items:center;justify-content:center;padding:0 20px;cursor:pointer;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sec{background:transparent;color:var(--brand)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--brand)}
.btn.sm{min-height:40px;font-size:14px;padding:0 14px;width:auto;border-radius:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.tint{background:var(--surface-2);border-color:transparent}
.card.hero{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.card.hero .fine{color:inherit;opacity:.85}
.card.hero .btn{background:var(--surface);border-color:var(--surface);color:var(--brand-ink)}
.card.work{background:var(--work-tint);border-color:transparent}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.badge.good{background:var(--good-tint);color:var(--good)}
.badge.attn{background:var(--work-tint);color:var(--work-ink)}
.badge.info{background:var(--brand-tint);color:var(--brand-ink)}
.badge.bad{background:var(--bad-tint);color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:14.5px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.chip.time[aria-pressed=false]{background:var(--work-tint);border-color:transparent;color:var(--work-ink)}
.chip.time[aria-pressed=true]{background:var(--work);border-color:var(--work);color:#2B1B00}
.chip.sm{min-height:36px;padding:0 12px;font-size:13.5px}
.field{display:grid;gap:6px}
.field label,.lbl{font-weight:700;font-size:14px}
.input{height:50px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:0 14px;font:500 16px var(--f-body);width:100%}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;width:100%}
.check .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:var(--on-brand)}
.check[aria-pressed=true]{border-color:var(--brand)}
.check[aria-pressed=true] .box{background:var(--brand);border-color:var(--brand)}
.alert{display:flex;gap:12px;padding:12px 14px;border-radius:12px;background:var(--work-tint);color:var(--work-ink);font-size:14px}
.alert.info{background:var(--brand-tint);color:var(--brand-ink)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--brand)}
.bar.work>i{background:var(--work)}
.head{display:flex;align-items:center;gap:8px;min-height:44px}
.back{width:44px;height:44px;border-radius:12px;border:0;background:var(--surface-2);display:grid;place-items:center;cursor:pointer;flex:none}
.sw{position:relative;width:48px;height:28px;border-radius:99px;background:var(--line);border:0;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-pressed=true]{background:var(--brand)}
.sw[aria-pressed=true]::after{transform:translateX(20px)}
.list{display:grid}
.li{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.ico{width:40px;height:40px;border-radius:12px;background:var(--brand-tint);color:var(--brand-ink);display:grid;place-items:center;flex:none}
.ico.work{background:var(--work-tint);color:var(--work-ink)}
.ico.good{background:var(--good-tint);color:var(--good)}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qa button{min-height:76px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;gap:6px;align-content:center;justify-items:start;padding:12px 14px;font-weight:700;cursor:pointer;text-align:left}
.qa .ic{color:var(--brand)}
.stp{display:flex;gap:6px;align-items:flex-start}
.stp>div{flex:1;min-width:0;display:grid;gap:6px;font-size:12px;font-weight:600;color:var(--muted);text-align:center;justify-items:center}
.stp .pt{width:26px;height:26px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--on-brand)}
.stp .on .pt{background:var(--brand)}.stp .on{color:var(--ink)}
.stp .now .pt{background:var(--work);color:#2B1B00}
.dayline{display:flex;height:16px;border-radius:99px;overflow:hidden;gap:2px}
.dayline i{background:var(--work);flex:1}.dayline b{background:var(--brand);width:22px;flex:none}
.rng{position:relative;height:10px;border-radius:99px;background:var(--surface-2);margin:10px 0 6px}
.rng i{position:absolute;top:0;bottom:0;background:var(--good-tint);border:1px solid var(--good);border-radius:99px;opacity:.9}
.rng b{position:absolute;top:-4px;width:18px;height:18px;border-radius:50%;border:3px solid var(--surface);margin-left:-9px;background:var(--good)}
.rng b.attn{background:var(--work)}
.qr{background:#fff;padding:10px;border-radius:12px;display:inline-block;line-height:0}

/* modal + toast */
.scrim{position:absolute;inset:0;background:rgba(6,25,28,.55);display:flex;align-items:flex-end;z-index:20}
.sheet{background:var(--surface);width:100%;border-radius:24px 24px 0 0;padding:20px;display:grid;gap:14px;max-height:88%;overflow:auto}
.scrim.center{align-items:center;justify-content:center;padding:16px}
.scrim.center .sheet{border-radius:var(--r-lg);max-width:460px}
.toast{position:fixed;left:50%;top:76px;pointer-events:none;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;z-index:50;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

/* welcome */
.welcome{display:flex;flex-direction:column;gap:18px;flex:1;justify-content:center}

/* care console */
.care{display:grid;grid-template-columns:248px minmax(0,1fr);width:100%;height:100%;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;position:relative}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;gap:6px;padding:20px 14px;min-height:0;overflow:auto}
.side .brand{color:#fff;padding:0 8px 16px}
.side .nv{display:flex;gap:12px;align-items:center;min-height:44px;padding:0 12px;border-radius:12px;border:0;background:transparent;color:inherit;font-weight:600;cursor:pointer;text-align:left;width:100%}
.side .nv[aria-current=page]{background:rgba(255,255,255,.12);color:#fff}
.side .nv .n{margin-left:auto;background:var(--work);color:#2B1B00;font-size:12px;font-weight:700;border-radius:99px;padding:1px 8px}
.side .who{margin-top:auto;border-top:1px solid var(--side-line);padding:14px 8px 0;display:grid;gap:8px;font-size:13px}
.main{overflow:auto;padding:24px 28px 32px;background:var(--bg);display:flex;flex-direction:column;gap:20px;min-width:0}
.ch{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.ch h1{font-size:28px;line-height:1.15}
.care-tabs{display:none}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:4px}
.kpi .v{font:700 34px/1 var(--f-display);font-variant-numeric:tabular-nums}
.kpi .l{font-weight:700;font-size:13.5px;color:var(--muted)}
.kpi.attn{background:var(--work-tint);border-color:transparent}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.pn{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px;align-content:start;min-width:0}
.pn h2{font-size:18px}
.tbl{display:grid;min-width:0}
.tr{display:grid;grid-template-columns:var(--cols);gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);min-width:0}
.tr>*{min-width:0}
.tr.th{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding-block:10px}
.tr.hv{cursor:pointer}.tr.hv:hover{background:var(--surface-2)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;background:var(--brand-tint);color:var(--brand-ink)}
.av.a1{background:var(--work-tint);color:var(--work-ink)}.av.a2{background:var(--good-tint);color:var(--good)}.av.a3{background:var(--surface-2);color:var(--ink)}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.tl{display:grid;gap:0}
.tl>div{display:grid;grid-template-columns:70px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.tl>div:last-child{border-bottom:0}
.ax{fill:var(--muted);font:11px var(--f-body)}
.frow{display:grid;gap:6px}

@media (max-width:1180px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}}
@media (max-width:1000px){.worker{grid-template-columns:minmax(0,1fr)}.guide{display:none}.wrap{justify-content:center}}
@media (max-width:900px){
  .care{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .side{display:none}
  .care-tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--side);color:var(--side-ink)}
  .care-tabs button{min-height:60px;background:none;border:0;color:inherit;display:grid;justify-items:center;align-content:center;gap:3px;font-size:11px;font-weight:600;cursor:pointer;position:relative}
  .care-tabs button[aria-current=page]{color:#fff;background:rgba(255,255,255,.12)}
  .main{padding:18px 16px 24px}
  .tr{grid-template-columns:1fr 1fr}.tr.th{display:none}.tr .cm{grid-column:1/-1}
  .cols2{grid-template-columns:1fr}
}
@media (max-width:520px){
  .top{gap:8px}.seg{order:3;flex:1 1 100%}.seg button{flex:1;justify-content:center;padding:0 8px}.tag{margin-left:auto}
  .wrap{margin-inline:-16px;width:calc(100% + 32px)}
  .phone{width:100%;height:100%;border:0;border-radius:0;box-shadow:none;border-top:1px solid var(--line)}
  .statusbar{display:none}
  .scroll{padding-top:16px}
  .kpis{gap:10px}.kpi .v{font-size:28px}
  .care{border-radius:12px}
  .ch h1{font-size:24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script>

function qr(seed, px = 6) {
  let x = seed; const rnd = () => (x = (x * 1664525 + 1013904223) >>> 0) / 4294967296; const N = 21; let r = '';
  const fin = (ox, oy) => { for (let i = 0; i < 7; i++)for (let j = 0; j < 7; j++) { const edge = i === 0 || j === 0 || i === 6 || j === 6, core = i > 1 && i < 5 && j > 1 && j < 5; if (edge || core) r += `<rect x="${(ox + i) * px}" y="${(oy + j) * px}" width="${px}" height="${px}"/>`; } };
  for (let i = 0; i < N; i++)for (let j = 0; j < N; j++) { const inF = (i < 8 && j < 8) || (i > 12 && j < 8) || (i < 8 && j > 12); if (!inF && rnd() > .52) r += `<rect x="${i * px}" y="${j * px}" width="${px}" height="${px}"/>`; }
  fin(0, 0); fin(14, 0); fin(0, 14);
  return `<span class="qr"><svg width="${N * px}" height="${N * px}" viewBox="0 0 ${N * px} ${N * px}" fill="#0C2C30" role="img" aria-label="Demo check-in code">${r}</svg></span>`;
}

function sFollow() {

  const up = [];
  if (m.stage === 'Booked') up.push(['calendar', `Screening ${dLabel(m.day).toLowerCase()}, ${m.time}`, sessOf(m.sess).name]);
  if (m.ref === 'Pending') up.push(['steth', 'Book your clinic appointment', 'Pick a time after your shift']);
  if (m.ref === 'Booked') { up.push(['steth', `Clinic visit ${dLabel(m.visitDay).toLowerCase()}, ${m.visitTime}`, provider(m)]); up.push(['bell', 'Reminder the day before', 'On WhatsApp']); }
  if (m.stage === 'Registered') up.push(['pin', 'Book your first screening', 'Near your work']);
  return phone(`${hd('Follow-up')}
    ${on ? `<div class="card gap12"><b>Referral progress</b><div class="stp">${steps.map((s, i) => `<div class="${i <= idx ? 'on' : ''} ${i === idx + 1 ? 'now' : ''}"><span class="pt">${i <= idx ? ic('check', 14) : ''}</span>${s}</div>`).join('')}</div></div>` : ''}
    <div class="card gap8"><b>Coming up</b>${up.length ? `<div class="list">${up.map(u => `<div class="li"><span class="ico work">${ic(u[0], 20)}</span><span class="grow"><b>${u[1]}</b><br><span class="fine">${u[2]}</span></span></div>`).join('')}</div>` : '<p class="fine">Nothing due right now.</p>'}</div>
    <div class="card row" style="gap:14px"><span class="ico good">${ic('repeat', 20)}</span><div class="grow"><span class="eyebrow">Next preventive milestone</span><br><b>Repeat screening in about 3 months</b><br><span class="fine">Timing to be confirmed by a clinician.</span></div></div>
    <div class="card"><b>How should we remind you?</b>${sw('rem', 'whatsapp', S.rem.whatsapp, 'WhatsApp')}${sw('rem', 'sms', S.rem.sms, 'SMS')}${sw('rem', 'app', S.rem.app, 'In the app')}</div>

/* ---------- care team (web) ---------- */
const stageBadge = s => ({ Registered: '', Booked: 'info', Referred: 'attn', 'Visit booked': 'info', 'On track': 'good' }[s] || '');
const refBadge = r => r === 'None' ? ['', 'None'] : r === 'Pending' ? ['attn', 'Needs appointment'] : r === 'Booked' ? ['info', 'Visit booked'] : ['good', 'Completed'];
const avc = p => ['', 'a1', 'a2', 'a3'][(parseInt(String(p.id).replace(/\D/g, '') || '0', 10)) % 4];
const followTask = p => ({ Registered: 'Book first screening', Booked: 'Screening reminder', Referred: 'Book clinic appointment', 'Visit booked': 'Visit reminder', 'On track': 'Repeat screening' }[p.stage]);
const nextText = p => p.stage === 'Registered' ? 'Book first screening' : p.stage === 'Booked' ? `${dLabel(p.day)}, ${p.time}` : p.stage === 'Referred' ? relDue(p.fu.off) : p.stage === 'Visit booked' ? `${dLabel(p.visitDay)}, ${p.visitTime}` : 'Repeat in about 3 months';

function kpis() {
  const n = P.length, scr = P.filter(p => SCREENED.includes(p.stage)).length;
  const refd = P.filter(p => p.ref !== 'None'), done = refd.filter(p => p.ref === 'Completed').length;
  return { n, scr, refd: refd.length, done, pend: refd.length - done, need: P.filter(p => p.ref === 'Pending').length, due: P.filter(p => p.fu.off != null && p.fu.off <= 1 && p.stage !== 'On track') };
}
const NAV = [['dashboard', 'dash', 'Programme dashboard', 'Overview'], ['participants', 'users', 'Participants', 'People'], ['sessions', 'calendar', 'Screening sessions', 'Sessions'], ['referrals', 'hospital', 'Referrals', 'Referrals'], ['followups', 'bell', 'Follow-ups', 'Follow-ups']];

    <div class="who"><b style="color:#fff">Meera, programme coordinator</b><span>Sees individual records of consented participants only.</span><span class="row" style="gap:6px">${ic('lock', 14)}Employers see totals only</span></div></aside>

}
const ch = (t, sub, right = '') => `<div class="ch"><div><span class="eyebrow">WorkWell care team</span><h1>${t}</h1><p class="lead" style="font-size:15px">${sub}</p></div>${right}</div>`;

function trendChart(v) {
  const W = 640, H = 240, pl = 32, pr = 8, pt = 16, pb = 46, max = Math.max(...v, 3), ym = max + (max % 2 ? 1 : 0), iw = W - pl - pr, ih = H - pt - pb, bw = iw / v.length;
  const y = n => pt + ih - n / ym * ih, avg = v.reduce((a, b) => a + b, 0) / v.length;
  let g = '', bars = '', lab = '';
  for (let t = 0; t <= ym; t += 2) g += `<line x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text class="ax" x="${pl - 8}" y="${y(t) + 4}" text-anchor="end">${t}</text>`;
  v.forEach((n, i) => { const x = pl + i * bw + bw * .2, w = bw * .6, last = i === v.length - 1;
    bars += `<rect x="${x}" y="${y(n)}" width="${w}" height="${Math.max(0, pt + ih - y(n))}" rx="3" fill="var(--brand)" opacity="${last ? 1 : .4}"/>`;
    if (n) lab += `<text class="ax" x="${x + w / 2}" y="${y(n) - 6}" text-anchor="middle" style="paint-order:stroke;stroke:var(--surface);stroke-width:4px;${last ? 'font-weight:700;fill:var(--ink)' : ''}">${n}</text>`;
    lab += `<text class="ax" x="${x + w / 2}" y="${H - 26}" text-anchor="middle">${i + 1}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Screenings completed per day, days 1 to ${v.length}" style="display:block;max-width:100%">${g}<line x1="${pl}" x2="${W - pr}" y1="${y(avg)}" y2="${y(avg)}" stroke="var(--work)" stroke-width="2" stroke-dasharray="5 4"/>${bars}${lab}<text class="ax" x="${(pl + W - pr) / 2}" y="${H - 6}" text-anchor="middle">Day of the pilot</text></svg>`;
}
const prog = (t, a, b, cls = '') => { const p = b ? Math.round(a / b * 100) : 0; return `<div class="frow"><div class="row between"><b>${t}</b><span class="num"><b>${p}%</b> <span class="fine">${a} of ${b}</span></span></div><div class="bar ${cls}"><i style="width:${p}%"></i></div></div>`; };

  <div class="kpis">

      <div class="pn"><div class="row between"><h2>Follow-ups due</h2><button class="btn sm ghost" data-a="ctab" data-t="followups">View all</button></div><div class="list">${k.due.slice(0, 4).map(p => `<button class="li" data-a="open" data-id="${p.id}" style="background:none;border:0;border-bottom:1px solid var(--line);text-align:left;cursor:pointer;width:100%"><span class="av ${avc(p)}">${initials(p.name)}</span><span class="grow"><b>${esc(p.name)}</b><br><span class="fine">${followTask(p)}</span></span><span class="badge ${p.fu.off < 0 ? 'bad' : 'attn'}">${relDue(p.fu.off)}</span></button>`).join('')}</div></div>

        <div class="list"><div class="li"><span class="grow">Workers enrolled</span><b class="num">${k.n}</b></div><div class="li"><span class="grow">Screenings completed</span><b class="num">${k.scr}</b></div></div>
        <p class="fine">Totals only. Names, readings and referral reasons are never shared with employers.</p></div>
    </div></div>`;
}

      <div class="pn"><h2>Follow-up</h2><div class="row between"><div><b>${followTask(p)}</b><br><span class="fine">${p.fu.off == null ? 'No date yet' : relDue(p.fu.off)}, by ${p.fu.ch}</span></div>${p.fu.off != null && p.fu.off < 0 ? '<span class="badge bad">Overdue</span>' : ''}</div>
        <div class="row" style="flex-wrap:wrap"><button class="btn sm sec" data-a="cremind" data-id="${p.id}">${ic('send', 16)}Send reminder</button><button class="btn sm ghost" data-a="clog" data-id="${p.id}">Log a call</button></div></div>
      <div class="pn"><h2>Upcoming actions</h2><div class="list">${up.length ? up.map(u => `<div class="li"><span class="ico work">${ic(u[0], 20)}</span><span class="grow"><b>${u[1]}</b><br><span class="fine">${esc(u[2])}</span></span></div>`).join('') : '<p class="fine">Nothing scheduled.</p>'}</div></div></div></div>`;
}

function cSessions() {
  const q = P.filter(p => p.stage === 'Booked' && p.day === 0);
  return `${ch('Screening sessions', 'Where and when screening happens')}
  <div class="cols2">${SESSIONS.map(s => { const b = booked(s.id); return `<div class="pn"><div class="row between"><h2>${s.name}</h2><span class="badge info">${s.kind}</span></div>
    <div class="gap8">${Object.entries(s.days).map(([d, ts]) => `<div class="row" style="gap:8px;flex-wrap:wrap"><span class="fine" style="min-width:88px">${dLabel(Number(d))}</span>${ts.map(t => `<span class="badge attn">${t}</span>`).join('')}</div>`).join('')}</div>
    <div class="gap8"><div class="bar"><i style="width:${Math.round(b / s.cap * 100)}%"></i></div><span class="fine">${b} of ${s.cap} booked, ${s.dist} from the nearest hub</span></div></div>`; }).join('')}</div>
  <div class="pn" style="padding:0;overflow:hidden"><div style="padding:18px 18px 4px"><h2>Today's check-in queue</h2></div><div class="tbl" style="--cols:2.4fr 1.5fr 1fr">
    <div class="tr th"><span>Participant</span><span>Session</span><span></span></div>
    ${q.length ? q.map(p => `<div class="tr"><div class="cm row"><span class="av ${avc(p)}">${initials(p.name)}</span><b>${esc(p.name)}</b></div><span class="fine">${sessOf(p.sess).name}, ${p.time}</span>${p.checkedIn ? '<span class="badge good">Checked in</span>' : `<button class="btn sm sec" data-a="checkin" data-id="${p.id}">Check in</button>`}</div>`).join('') : '<div class="tr"><span class="fine cm">No one is booked for today.</span></div>'}</div></div>`;
}

function cRefs() {
  const t = S.care.refTab, list = P.filter(p => p.ref !== 'None' && (t === 'All' || (t === 'Needs appointment' && p.ref === 'Pending') || (t === 'Booked' && p.ref === 'Booked') || (t === 'Completed' && p.ref === 'Completed')));
  return `${ch('Referrals', 'Helping each person reach a clinic and back')}
  <div class="chips">${['Needs appointment', 'Booked', 'Completed', 'All'].map(x => `<button class="chip sm" data-a="reftab" data-v="${x}" aria-pressed="${t === x}">${x}</button>`).join('')}</div>
  <div class="pn" style="padding:0;overflow:hidden"><div class="tbl" style="--cols:2fr 2fr 1.6fr 1.3fr 1.2fr"><div class="tr th"><span>Participant</span><span>Reason</span><span>Clinic</span><span>Status</span><span></span></div>
  ${list.length ? list.map(p => { const rb = refBadge(p.ref); return `<div class="tr"><div class="cm row"><span class="av ${avc(p)}">${initials(p.name)}</span><button data-a="open" data-id="${p.id}" style="background:none;border:0;padding:0;text-align:left;cursor:pointer"><b>${esc(p.name)}</b></button></div><span class="fine">${esc(p.reason)}</span><span class="fine">${provider(p)}</span><span><span class="badge ${rb[0]}">${rb[1]}</span></span>${p.ref === 'Pending' ? `<button class="btn sm sec" data-a="advance" data-id="${p.id}">Book visit</button>` : p.ref === 'Booked' ? `<button class="btn sm sec" data-a="advance" data-id="${p.id}">Mark done</button>` : '<span class="fine">Closed</span>'}</div>`; }).join('') : '<div class="tr"><span class="fine cm">Nothing here.</span></div>'}</div></div>`;
}

function cFollow() {
  const all = P.filter(p => p.fu.off != null && p.stage !== 'On track').sort((a, b) => a.fu.off - b.fu.off);
  const groups = [['Overdue', p => p.fu.off < 0], ['Due today', p => p.fu.off === 0], ['Coming up', p => p.fu.off > 0]];
  return `${ch('Follow-ups', 'Reminders and check-ins for everyone with a next step')}
  ${groups.map(([t, f]) => { const l = all.filter(f); return l.length ? `<div class="pn" style="padding:0;overflow:hidden"><div style="padding:18px 18px 4px"><h2>${t} <span class="badge ${t === 'Overdue' ? 'bad' : t === 'Due today' ? 'attn' : ''}">${l.length}</span></h2></div><div class="tbl" style="--cols:2.2fr 1.8fr 1.2fr 1.2fr">${l.map(p => `<div class="tr"><div class="cm row"><span class="av ${avc(p)}">${initials(p.name)}</span><button data-a="open" data-id="${p.id}" style="background:none;border:0;padding:0;text-align:left;cursor:pointer"><b>${esc(p.name)}</b></button></div><span>${followTask(p)}</span><span class="fine">${relDue(p.fu.off)}, ${p.fu.ch}</span><button class="btn sm sec" data-a="cremind" data-id="${p.id}">${ic('send', 16)}Remind</button></div>`).join('')}</div></div>` : ''; }).join('')}`;
}

function careModal() {
  const m = S.care.modal; if (!m) return '';
  const p = P.find(x => x.id === m.id);
  return `<div class="scrim center" data-a="cclose"><div class="sheet" role="dialog" aria-modal="true"><h2 class="h2">Send a reminder</h2><p class="fine">To ${esc(p.name)} about: ${followTask(p).toLowerCase()}</p>
    <div class="chips">${['WhatsApp', 'SMS', 'App', 'Phone call'].map(c => chip('cch', c, S.care.ch === c)).join('')}</div>
    <div class="row"><button class="btn sec" data-a="cclose">Cancel</button><button class="btn" data-a="csend" data-id="${p.id}">Queue reminder</button></div></div></div>`;
}
function sCare() {
  const t = S.care.tab, body = t === 'dashboard' ? cDash() : t === 'participants' ? cParts() : t === 'sessions' ? cSessions() : t === 'referrals' ? cRefs() : cFollow();
  return careShell(body);
}

/* ---------- app shell, actions, render ---------- */
const topBar = () => `<header class="top"><div class="brand"><span class="mark">${ic('pulse', 20)}</span>WorkWell</div>
  <div class="seg" role="group" aria-label="Choose an experience"><button data-a="view" data-v="worker" aria-pressed="${S.view === 'worker'}">${ic('smartphone', 18)}Worker app</button><button data-a="view" data-v="care" aria-pressed="${S.view === 'care'}">${ic('monitor', 18)}Care team</button></div>
  <span class="tag">Prototype, fictional data</span></header>`;

function guide() {
  const m = me();
  const st = [['Register', !!m], ['Book a screening', !!m && m.stage !== 'Registered'], ['See your results', !!m && SCREENED.includes(m.stage)], ['Book the clinic visit', !!m && m.ref !== 'None' && m.ref !== 'Pending'], ['Complete the follow-up', !!m && m.ref === 'Completed']];
  return `<aside class="guide"><span class="eyebrow">Demo guide</span><h2>Follow one worker through WorkWell</h2>
    <ol>${st.map(([t, d]) => `<li class="${d ? 'done' : ''}"><span class="dot">${d ? ic('check', 14) : ''}</span>${t}</li>`).join('')}</ol>
    <p class="fine">Then open the care team view to see the same person appear in the programme. Choose Female in the profile to see the optional women's health module.</p>
    <div class="row" style="flex-wrap:wrap"><button class="btn sm" data-a="view" data-v="care">Open care team view</button><button class="btn sm sec" data-a="reset">Restart demo</button></div></aside>`;
}
const SCREENS = { welcome: sWelcome, profile: sProfile, dashboard: sDash, find: sFind, book: sBook, confirm: sConfirm, results: sResults, referral: sReferral, followup: sFollow, record: sRecord };
function sWorker() {
  if (!me() && !['welcome', 'profile'].includes(S.screen)) S.screen = 'welcome';
  if (S.screen === 'book' && !S.book.sess) S.screen = 'find';
  return `<div class="worker">${guide()}${SCREENS[S.screen]()}</div>`;
}

let lastKey = '';
function render() {
  const sc = $('#scroll'), mn = $('#main'), key = S.view + S.screen + S.care.tab + S.care.sel;
  const a = sc ? sc.scrollTop : 0, b = mn ? mn.scrollTop : 0;
  $('#root').innerHTML = `${topBar()}<main class="stage" id="stage">${S.view === 'worker' ? sWorker() : sCare()}</main>`;
  if (key === lastKey) { const x = $('#scroll'); if (x) x.scrollTop = a; const y = $('#main'); if (y) y.scrollTop = b; }
  lastKey = S.view + S.screen + S.care.tab + S.care.sel;
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 2600); }

function register() {
  const f = S.form; P = P.filter(p => p.id !== 'me');
  P.unshift({ id: 'me', name: f.name.trim(), age: parseInt(f.age, 10) || 29, g: f.gender === 'Male' ? 'Male' : f.gender === 'Female' ? 'Female' : 'Other', job: f.job, group: 'Rider Hub', stage: 'Registered', ref: 'None', fu: { off: null, ch: 'WhatsApp' }, reason: '', hist: [{ off: 0, title: 'Registered', note: 'Consent recorded.' }], women: false, checkedIn: false, sess: null, day: null, time: null, visitDay: null, visitTime: null });
  S.screen = 'dashboard';
}
function confirmBooking() {
  const m = me(), b = S.book; m.stage = 'Booked'; m.sess = b.sess; m.day = b.day; m.time = b.time; m.fu = { off: b.day, ch: 'WhatsApp' }; m.checkedIn = false;
  log(m, 'Screening booked', `${dLabel(b.day)}, ${b.time}, ${sessOf(b.sess).name}`); S.screen = 'confirm'; toast('Booking confirmed');
}
function finishScreening() {
  const m = me(); if (m.stage === 'Booked' || m.stage === 'Registered') {
    if (!m.sess) { m.sess = 'hub'; }
    m.stage = 'Referred'; m.ref = 'Pending'; m.reason = 'Blood pressure and blood sugar readings flagged'; m.fu = { off: 0, ch: 'WhatsApp' };
    log(m, 'Screening completed', 'Two readings above the usual range on the day. Suggested a clinician check.');
  }
}
function advance(id) {
  const p = P.find(x => x.id === id);
  if (p.ref === 'Pending') { p.ref = 'Booked'; p.stage = 'Visit booked'; p.visitDay = 2; p.visitTime = '6:30 pm'; p.fu = { off: 2, ch: p.fu.ch }; log(p, 'Clinic visit booked', `${dLabel(2)}, 6:30 pm, ${provider(p)}. Booked by the care team.`); toast('Clinic visit booked'); }
  else if (p.ref === 'Booked') { p.ref = 'Completed'; p.stage = 'On track'; p.fu = { off: 90, ch: p.fu.ch }; log(p, 'Clinic visit completed', 'Record updated. Next screening scheduled.'); toast('Visit marked as completed'); }
}

function act(a, d) {
  switch (a) {
    case 'view': S.view = d.v; S.modal = null; S.care.modal = null; break;
    case 'reset': initState(); toast('Demo restarted'); break;
    case 'go': S.screen = d.s; S.modal = null; break;
    case 'lang': S.lang = d.v; break;
    case 'gender': S.form.gender = d.v; break;
    case 'job': S.form.job = d.v; break;
    case 'checkup': S.form.checkup = d.v; break;
    case 'cond': { const c = S.form.cond; if (d.v === 'None' || d.v === 'Prefer not to say') S.form.cond = [d.v]; else { const i = c.indexOf(d.v); S.form.cond = c.filter(x => x !== 'None' && x !== 'Prefer not to say'); i < 0 ? S.form.cond.push(d.v) : S.form.cond.splice(S.form.cond.indexOf(d.v), 1); if (!S.form.cond.length) S.form.cond = ['None']; } break; }
    case 'c1': S.form.c1 = !S.form.c1; break;
    case 'c2': S.form.c2 = !S.form.c2; break;
    case 'register': register(); break;
    case 'filter': S.find.filter = d.v; break;
    case 'pick': { const s = sessOf(d.id), d0 = firstDay(s); S.book = { sess: d.id, day: d0, time: s.days[d0][0], remind: true }; S.screen = 'book'; break; }
    case 'day': S.book.day = Number(d.v); S.book.time = sessOf(S.book.sess).days[S.book.day][0]; break;
    case 'time': S.book.time = d.v; break;
    case 'remind': S.book.remind = !S.book.remind; break;
    case 'confirm': confirmBooking(); break;
    case 'results': finishScreening(); S.screen = 'results'; break;
    case 'slot': S.ref.slot = Number(d.v); break;
    case 'share': S.ref.share = !S.ref.share; break;
    case 'bookref': { const m = me(), x = SLOTS[S.ref.slot]; m.ref = 'Booked'; m.stage = 'Visit booked'; m.visitDay = x.day; m.visitTime = x.time; m.fu = { off: x.day, ch: 'WhatsApp' }; log(m, 'Clinic visit booked', `${dLabel(x.day)}, ${x.time}, ${provider(m)}`); S.screen = 'followup'; toast('Appointment booked'); break; }
    case 'visitdone': { const m = me(); m.ref = 'Completed'; m.stage = 'On track'; m.fu = { off: 90, ch: 'WhatsApp' }; log(m, 'Clinic visit completed', 'Record updated. Next screening scheduled.'); toast('Visit marked as done'); break; }
    case 'rem': S.rem[d.k] = !S.rem[d.k]; break;
    case 'women': S.women = !S.women; { const m = me(); if (m) m.women = S.women; } break;
    case 'modal': S.modal = d.m; break;
    case 'close': S.modal = null; break;
    case 'copy': try { navigator.clipboard.writeText(d.v).then(() => toast('Number copied'), () => toast('Copy was blocked. Select the number instead.')); } catch (e) { toast('Copy was blocked. Select the number instead.'); } return;
    /* care team */
    case 'ctab': S.care.tab = d.t; S.care.sel = null; break;
    case 'open': S.care.tab = 'participants'; S.care.sel = d.id; S.view = 'care'; break;
    case 'back': S.care.sel = null; break;
    case 'cstage': S.care.stage = d.v; break;
    case 'reftab': S.care.refTab = d.v; break;
    case 'advance': advance(d.id); break;
    case 'cremind': S.care.modal = { id: d.id }; break;
    case 'cclose': S.care.modal = null; break;
    case 'cch': S.care.ch = d.v; break;
    case 'csend': { const p = P.find(x => x.id === d.id); S.care.modal = null; log(p, 'Reminder sent', `${S.care.ch} reminder about ${followTask(p).toLowerCase()} (demo).`); toast('Reminder queued (demo)'); break; }
    case 'clog': { const p = P.find(x => x.id === d.id); log(p, 'Coordinator call logged', 'Call recorded by the care team (demo).'); toast('Call logged'); break; }
    case 'checkin': { const p = P.find(x => x.id === d.id); p.checkedIn = true; log(p, 'Checked in at session', sessOf(p.sess).name); toast(`${short(p.name)} checked in`); break; }
  }
  render();
}

document.addEventListener('click', e => { const el = e.target.closest('[data-a]'); if (!el || el.disabled) return; if (el.classList.contains('scrim') && e.target !== el) return; act(el.dataset.a, el.dataset); });
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button][data-a]')) { e.preventDefault(); e.target.click(); } });
document.addEventListener('input', e => {
  const f = e.target.dataset.f;
  if (f) { S.form[f] = e.target.value; const b = $('#cta-profile'); if (b) b.disabled = !(S.form.name.trim().length > 1 && S.form.c1); }
  if (e.target.id === 'q') { S.care.q = e.target.value; $('#plist').innerHTML = plistHtml(); }
});

initState();
render();
window.__ww = { act, render, get S() { return S; }, get P() { return P; } };

</script>
</body>
</html>
